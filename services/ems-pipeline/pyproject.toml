[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-pie-ems-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
ems-pipeline = "ems_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

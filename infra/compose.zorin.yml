x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/database.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *default-logging

  web:
    image: music-pie-web:current
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/web.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3104:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [frontend, backend, egress]
    logging: *default-logging

  tunnel:
    image: cloudflare/cloudflared:latest@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
    profiles: [tunnel]
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/tunnel.env
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    logging: *default-logging

networks:
  frontend:
    name: music-pie-frontend
  backend:
    name: music-pie-backend
    internal: true
  egress:
    name: music-pie-egress

volumes:
  postgres-data:
    name: music-pie-postgres-data

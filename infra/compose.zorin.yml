x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/database.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *default-logging

  embedding:
    image: music-pie-embedding:current
    build:
      context: ../services/embedding
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [backend]
    mem_limit: 3g
    cpus: 4.0
    logging: *default-logging

  ems-pipeline:
    image: music-pie-ems-pipeline:current
    build:
      context: ../services/ems-pipeline
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/ems.env
    environment:
      EMBEDDING_SERVICE_URL: http://embedding:8000
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "from ems_pipeline.worker import HealthGate; assert HealthGate().can_run(disk_used_percent=0, database_ready=True, embedding_ready=True)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  web:
    image: music-pie-web:current
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/web.env
    environment:
      EMBEDDING_SERVICE_URL: http://embedding:8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3104:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [frontend, backend, egress]
    logging: *default-logging

  tunnel:
    image: cloudflare/cloudflared:latest@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
    profiles: [tunnel]
    restart: unless-stopped
    env_file: /home/approid/apps/music-pie/shared/secrets/tunnel.env
    command: tunnel --no-autoupdate --url http://web:3000 run
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    logging: *default-logging

networks:
  frontend:
    name: music-pie-frontend
  backend:
    name: music-pie-backend
    internal: true
  egress:
    name: music-pie-egress

volumes:
  postgres-data:
    name: music-pie-postgres-data
